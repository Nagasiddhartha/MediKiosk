services:
  db:
    image: pgvector/pgvector:pg16
    container_name: medikiosk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk
      POSTGRES_DB: medikiosk
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk -d medikiosk"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk-api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://medikiosk:medikiosk@db:5432/medikiosk
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: medikiosk-dev-secret-change-later
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      STORAGE_ROOT: /app/storage
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  storage_data: